<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">TagSignal — what price range is supported?</title>
  <desc id="desc">TagSignal wordmark with bounded demand and contribution curves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173C3A"/><stop offset="1" stop-color="#102C2A"/></linearGradient>
    <clipPath id="clip"><rect width="1600" height="520" rx="34"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
